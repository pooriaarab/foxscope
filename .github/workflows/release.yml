# main = staging, release = production.
# Merge main into release to publish the version in package.json to npm.
# Promote with a merge commit, never a squash: a squash leaves release with
# a commit main lacks, and the next promotion then conflicts.
name: Release

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default; each job names what it needs.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse a version that is already released
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            echo "::error::Version ${VERSION} is already released. Bump the version in package.json."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:local
      # The later jobs ship this build, so npm and AMO get what was checked.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            dist
            dist-ext
          if-no-files-found: error
          retention-days: 5
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser is on Ichabod; cloudflared lets it reach the pages the test serves.
      # The sha256 is the one in the cloudflared 2026.10.0 release notes.
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64
          echo "d33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db  $RUNNER_TEMP/cloudflared" | sha256sum -c
          sudo install -m 0755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared
      - name: The Firefox E2E on Ichabod
        env:
          FOXKIT_BROWSER: ichabod
          ICHABOD_API_KEY: ${{ secrets.ICHABOD_API_KEY }}
        run: |
          if [ -z "$ICHABOD_API_KEY" ]; then
            echo "::error::Secret ICHABOD_API_KEY is empty. Add an Ichabod project API key as the repository secret ICHABOD_API_KEY, then push to release again."
            exit 1
          fi
          pnpm e2e
  npm:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No install and no build here: nothing a dependency runs may see the OIDC token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Secret NPM_TOKEN is empty. Add an npm automation token as the repository secret NPM_TOKEN, then push to release again."
            exit 1
          fi
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER is already on npm. Skipping publish so the signing step can run."
          else
            npm publish --ignore-scripts --provenance --access public
          fi
  amo:
    needs: [npm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      review-url: ${{ steps.sign.outputs.review-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - name: Submit the extension to AMO as a listed add-on
        id: sign
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          missing=0
          for name in AMO_JWT_ISSUER AMO_JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty. Add your AMO API key as repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          node scripts/amo-listing.mjs check
          # A re-run after a later step failed must not submit the same
          # version again: AMO refuses a version number it already has.
          STATUS=$(node scripts/amo-listing.mjs version-status)
          if [ "${STATUS%% *}" = "listed" ]; then
            echo "AMO already has this version as listed. Skipping web-ext sign."
            echo "${STATUS#listed}" | tr -d ' ' > "$RUNNER_TEMP/review-url.txt"
          else
            node scripts/amo-listing.mjs metadata "$RUNNER_TEMP/amo-metadata.json"
            # AMO reviewers get the source, because dist-ext/ is bundled.
            git archive --format=zip -o source.zip HEAD
            # A listed version waits for AMO review, which can take days. With
            # --approval-timeout=0, web-ext returns after AMO accepts the
            # upload, the listing and the source, and it downloads no signed
            # file (web-ext 10, lib/util/submit-addon.js, doAfterSubmit). AMO
            # publishes the signed file on the listing page after approval.
            pnpm exec web-ext sign -s dist-ext -a web-ext-artifacts --channel=listed \
              --amo-metadata "$RUNNER_TEMP/amo-metadata.json" --approval-timeout=0 \
              --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET" \
              --upload-source-code source.zip 2>&1 | tee "$RUNNER_TEMP/sign.log"
            if ! grep -q "Waiting for approval and download of signed XPI skipped" "$RUNNER_TEMP/sign.log"; then
              echo "::error::web-ext did not confirm the listed submission. Read the web-ext log above."
              exit 1
            fi
            sed -n 's/.*can be downloaded from \([^ ]*\).*/\1/p' "$RUNNER_TEMP/sign.log" | tail -1 > "$RUNNER_TEMP/review-url.txt"
          fi
          # The privacy policy and the listing icon have their own AMO endpoints.
          node scripts/amo-listing.mjs after-submit
          echo "review-url=$(cat "$RUNNER_TEMP/review-url.txt")" >> "$GITHUB_OUTPUT"
  github-release:
    needs: [amo]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the tag and create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_URL: ${{ needs.amo.outputs.review-url }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SLUG=$(node -p "require('./extension/amo-metadata.json').slug")
          # --notes goes before the generated notes.
          NOTES=(--notes "Submitted for AMO review as a listed add-on. After approval, install it from https://addons.mozilla.org/firefox/addon/${SLUG}/ (review status for the authors: ${REVIEW_URL:-the AMO Developer Hub}).")
          # gh creates the tag v<version> on this commit when it does not exist.
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes "${NOTES[@]}"
